name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build pkg-config libssl-dev
      - name: Build and Test
        run: ninja check
